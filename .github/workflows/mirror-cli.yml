name: Mirror validated CLI release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published CLI tag to mirror, including development releases
        required: true
        type: string
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: write

concurrency:
  group: cli-release-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify and mirror the published CLI distribution
        env:
          GH_TOKEN: ${{ github.token }}
          CLI_TAG: ${{ inputs.tag }}
        run: node scripts/mirror-cli.mjs "$CLI_TAG"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cli-mirror-report
          path: ${{ runner.temp }}/cli-mirror/report.json
          if-no-files-found: error

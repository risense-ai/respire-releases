# Historical releases remain available. New CLI distribution is owned by
# risense-ai/respire-cli; this workflow must not mirror or publish new assets.
name: Legacy CLI mirror retired

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - name: Use the CLI repository for current releases
        run: echo 'CLI releases are published at https://github.com/risense-ai/respire-cli/releases . Historical releases and SDK drafts in this repository are retained.'
